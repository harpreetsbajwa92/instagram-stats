<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram Stats</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--line:#232938;--tx:#eef1f7;--mut:#8b93a7;--ac:#e1306c;--ac2:#833ab4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:760px;margin:auto}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:600;font-size:15px}
.tab.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--ac2),var(--ac))}
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.c .l{color:var(--mut);font-size:12px}.c .n{font-size:30px;font-weight:700;margin:2px 0}.c .t{color:var(--mut);font-size:12px}
h2{font-size:16px;margin:18px 0 8px}.p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.p a{color:var(--ac);font-weight:600;text-decoration:none}.p .m{color:var(--mut);font-size:12px}.empty{color:var(--mut);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:12px}
</style></head><body>
<h1>Instagram Stats</h1><div class="sub" id="upd">Loading…</div>
<div class="tabs"><button class="tab on" data-t="regular">Regular</button><button class="tab" data-t="professionals">Professionals</button></div>
<div id="app"></div>
<script>
let D,T='regular';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 const tr=D.tracks[T],P=tr.people,td=today(),goal=D.goals[T];
 const f=P.length,ft=P.filter(p=>p.followed===td).length;
 const a=P.filter(p=>p.accepted).length,at=P.filter(p=>p.accepted===td).length;
 const x=P.reduce((s,p)=>s+p.texts.length,0),xt=P.reduce((s,p)=>s+p.texts.filter(d=>d===td).length,0);
 const ch=P.filter(p=>p.chat).length;
 const rate=f?Math.round(a/f*100):0;
 const card=(l,n,t)=>`<div class="c"><div class="l">${l}</div><div class="n">${n}</div><div class="t">${t}</div></div>`;
 const pr=tr.prospects.slice().reverse().map(p=>`<div class="p"><a href="https://instagram.com/${encodeURIComponent(p.handle)}" target="_blank" rel="noopener">@${esc(p.handle)}</a> ${p.name?'· '+esc(p.name):''}<div class="m">${esc(p.date)}</div><div>${esc(p.note)}</div></div>`).join('')||'<div class="empty">No good prospects yet</div>';
 document.getElementById('app').innerHTML=
 `<div class="goal"><b>Daily goal: ${ft} / ${goal} follows</b><div class="bar"><i style="width:${Math.min(100,ft/goal*100)}%"></i></div></div>
 <div class="grid">${card('Follows done',ft,'total '+f)}${card('Requests accepted',at,'total '+a+' · '+rate+'% rate')}${card('Texts sent',xt,'total '+x)}${card('Active chats',ch,'currently')}</div>
 <h2>Good prospects</h2>${pr}`;
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{T=b.dataset.t;document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e===b));render()});
async function load(){try{D=await (await fetch('data.json?t='+Date.now(),{cache:'no-store'})).json();
 document.getElementById('upd').textContent=D.updated?'Updated '+new Date(D.updated).toLocaleString():'No activity yet';render()}catch(e){document.getElementById('upd').textContent='Failed to load data'}}
load();setInterval(load,60000);
</script></body></html>
