<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Instagram Stats</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--line:#232938;--tx:#eef1f7;--mut:#8b93a7;--ac:#e1306c;--ac2:#833ab4;--ok:#22c55e}
*{box-sizing:border-box}html{-webkit-tap-highlight-color:transparent}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px 16px 84px;max-width:640px}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:9px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:600;font-size:14px}
.seg button.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--ac2),var(--ac))}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0f121a;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));max-width:640px;margin:auto;z-index:5}
.nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px;font-weight:700;font-size:14px;border-radius:10px}.nav button.on{color:#fff;background:linear-gradient(135deg,var(--ac2),var(--ac))}
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));width:0}.bar i.done{background:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.c .l{color:var(--mut);font-size:12px}.c .n{font-size:30px;font-weight:700;margin:2px 0}.c .t{color:var(--mut);font-size:12px}
h2{font-size:16px;margin:18px 0 8px}.p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.p a,.hd a{color:var(--ac);font-weight:600;text-decoration:none}.p .m{color:var(--mut);font-size:12px}.empty{color:var(--mut);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.chart .h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.chart .h b{font-size:14px}.chart .h span{color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bars i{display:block;width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--ac),var(--ac2));min-height:2px}.bars em{font-style:normal;font-size:10px;color:var(--mut);margin-bottom:2px}
.lbls{display:flex;gap:4px;margin-top:4px}.lbls span{flex:1;text-align:center;font-size:9.5px;color:var(--mut);overflow:hidden;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mut);font-weight:600;text-align:right;padding:6px 4px;font-size:11px}th:first-child,td:first-child{text-align:left}
td{padding:10px 4px;border-top:1px solid var(--line);text-align:right}tr.d{cursor:pointer}tr.d:active{background:var(--card)}td small{display:block;color:var(--mut);font-size:10px}td.hit{color:var(--ok);font-weight:700}
.det td{text-align:left;background:#10131b;font-size:13px}.det .hd{margin:3px 0}.tag{color:var(--mut)}
</style></head><body>
<h1>Instagram Stats</h1><div class="sub" id="upd">Loading…</div>
<div id="app"></div>
<div class="nav"><button data-v="today" class="on">Today</button><button data-v="trends">Trends</button><button data-v="history">History</button></div>
<script>
let D,V='today',T='regular',F='combined',PER='weekly',OPEN=null;
const TR=['regular','professionals'],K=['follows','accepted','texts','chats','flagged'];
const NM={follows:'Follows',accepted:'Accepted',texts:'Texts',chats:'Active chats',flagged:'Prospects'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayS=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto'}).format(new Date());
const toD=s=>new Date(s+'T12:00:00Z'),fmt=d=>d.toISOString().slice(0,10),addD=(s,n)=>{const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return fmt(d)};
const Z={follows:0,accepted:0,texts:0,chats:0,flagged:0};
const row=(t,day)=>({...Z,...((D.tracks[t].days||{})[day]||{})});
const tracksOf=f=>f==='combined'?TR:[f];
const goalOf=f=>tracksOf(f).reduce((s,t)=>s+D.goals[t],0);
const rowF=(f,day)=>tracksOf(f).reduce((r,t)=>{const x=row(t,day);K.forEach(k=>r[k]+=x[k]);return r},{...Z});
const allDays=f=>[...new Set(tracksOf(f).flatMap(t=>Object.keys(D.tracks[t].days||{})))].sort();
const rate=(a,f)=>f?Math.round(a/f*100)+'%':'–';
const card=(l,n,t)=>`<div class="c"><div class="l">${l}</div><div class="n">${n}</div><div class="t">${t}</div></div>`;
const seg=(opts,cur,attr)=>`<div class="seg">${opts.map(([v,l])=>`<button data-${attr}="${v}" class="${v===cur?'on':''}">${l}</button>`).join('')}</div>`;
const FOPT=[['regular','Regular'],['professionals','Professionals'],['combined','Combined']];

function today(){
 const td=todayS(),r=row(T,td),goal=D.goals[T],tr=D.tracks[T];
 const tot=k=>Object.values(tr.days||{}).reduce((s,x)=>s+(x[k]||0),0);
 const f=tot('follows'),a=tot('accepted');
 const pr=tr.prospects.slice().reverse().map(p=>`<div class="p"><a href="https://instagram.com/${encodeURIComponent(p.handle)}" target="_blank" rel="noopener">@${esc(p.handle)}</a> ${p.name?'· '+esc(p.name):''}<div class="m">${esc(p.date)}</div><div>${esc(p.note)}</div></div>`).join('')||'<div class="empty">No good prospects yet</div>';
 const bar=(l,v,g)=>`<div class="goal"><b>${l}: ${v} / ${g}</b>${v>=g?' ✅':''}<div class="bar"><i class="${v>=g?'done':''}" style="width:${Math.min(100,v/g*100)}%"></i></div></div>`;
 return seg([['regular','Regular'],['professionals','Professionals']],T,'t')+
 `<div class="grid">${card('Follows today',r.follows,'total '+f)}${card('Accepted today',r.accepted,'total '+a+' · '+rate(a,f)+' rate')}${card('Texts today',r.texts,'total '+tot('texts'))}${card('Active chats',r.chats,'new today · total '+tot('chats'))}</div>`+
 bar('Daily goal (follows)',r.follows,goal)+`<h2>Good prospects</h2>${pr}`;
}

function periods(){
 const td=todayS(),out=[];
 if(PER==='weekly'){const dow=(toD(td).getUTCDay()+6)%7,ws=addD(td,-dow);
  for(let i=7;i>=0;i--){const s=addD(ws,-7*i);out.push({s,e:addD(s,6),l:s.slice(5).replace('-','/')})}}
 else if(PER==='monthly'){const [y,m]=td.split('-').map(Number);
  for(let i=5;i>=0;i--){const dt=new Date(Date.UTC(y,m-1-i,1)),s=fmt(dt),e=fmt(new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0)));out.push({s,e,l:dt.toLocaleString('en',{month:'short',timeZone:'UTC'})})}}
 else{const y=+td.slice(0,4);for(let i=2;i>=0;i--)out.push({s:(y-i)+'-01-01',e:(y-i)+'-12-31',l:String(y-i)})}
 return out;
}
function streaks(f){ // consecutive days (ending today, or yesterday if today not yet hit) hitting goal
 const g=goalOf(f),td=todayS();let cur=0,best=0,run=0;const days=allDays(f);
 if(days.length){let d=days[0];while(d<=td){if(rowF(f,d).follows>=g){run++;best=Math.max(best,run)}else run=0;d=addD(d,1)}}
 let d=td;if(rowF(f,d).follows<g)d=addD(d,-1);
 while(rowF(f,d).follows>=g&&d>='2000'){cur++;d=addD(d,-1)}
 return {cur,best};
}
function trends(){
 const ps=periods(),g=goalOf(F),days=allDays(F);
 const data=ps.map(p=>{const t={...Z};let hit=0;days.filter(d=>d>=p.s&&d<=p.e).forEach(d=>{const r=rowF(F,d);K.forEach(k=>t[k]+=r[k]);if(r.follows>=g)hit++});return {...p,t,hit}});
 const cur=data[data.length-1],st=streaks(F);
 const ch=(k)=>{const mx=Math.max(1,...data.map(x=>x.t[k]));
  return `<div class="chart"><div class="h"><b>${NM[k]}</b><span>this ${PER==='weekly'?'week':PER==='monthly'?'month':'year'}: ${cur.t[k]}</span></div><div class="bars">${data.map(x=>`<div><em>${x.t[k]||''}</em><i style="height:${x.t[k]/mx*80}%"></i></div>`).join('')}</div><div class="lbls">${data.map(x=>`<span>${x.l}</span>`).join('')}</div></div>`};
 const totAll=days.reduce((t,d)=>{const r=rowF(F,d);K.forEach(k=>t[k]+=r[k]);return t},{...Z});
 return seg(FOPT,F,'f')+seg([['weekly','Weekly'],['monthly','Monthly'],['yearly','Yearly']],PER,'p')+
 `<div class="grid">${card('Follows',cur.t.follows,'this period')}${card('Acceptance rate',rate(cur.t.accepted,cur.t.follows),cur.t.accepted+' of '+cur.t.follows+' accepted')}${card('Days hit goal',cur.hit,'goal '+g+'/day · this period')}${card('Current streak',st.cur+' d','best '+st.best+' d')}</div>`+
 ['follows','accepted','texts','chats'].map(ch).join('')+
 `<div class="goal"><b>All time</b><div class="m" style="color:var(--mut);font-size:13px;margin-top:4px">${totAll.follows} follows · ${totAll.accepted} accepted (${rate(totAll.accepted,totAll.follows)}) · ${totAll.texts} texts · ${totAll.chats} active chats · ${totAll.flagged} prospects</div></div>`;
}

function detail(day){
 let h='';
 tracksOf(F).forEach(t=>{const P=D.tracks[t].people,L=(arr)=>arr.map(p=>`<a href="https://instagram.com/${encodeURIComponent(p.handle)}" target="_blank" rel="noopener">@${esc(p.handle)}</a>`).join(', ')||'<span class="tag">–</span>';
  const pr=D.tracks[t].prospects.filter(x=>x.date===day);
  h+=`<div class="hd"><b>${t==='regular'?'Regular':'Professionals'}</b></div>
  <div class="hd"><span class="tag">Followed:</span> ${L(P.filter(p=>p.followed===day))}</div>
  <div class="hd"><span class="tag">Accepted:</span> ${L(P.filter(p=>p.accepted===day))}</div>
  <div class="hd"><span class="tag">Texted:</span> ${L(P.filter(p=>p.texts.includes(day)))}</div>
  <div class="hd"><span class="tag">Active chats:</span> ${L(P.filter(p=>p.chatDate===day))}</div>
  <div class="hd"><span class="tag">Prospects:</span> ${pr.map(x=>`<a href="https://instagram.com/${encodeURIComponent(x.handle)}" target="_blank" rel="noopener">@${esc(x.handle)}</a> – ${esc(x.note)}`).join('; ')||'<span class="tag">–</span>'}</div>`});
 return h;
}
function history(){
 const days=allDays(F).reverse(),g=goalOf(F);
 const cell=(k,day)=>{const v=rowF(F,day)[k];let sub='';if(F==='combined')sub=`<small>${row('regular',day)[k]}+${row('professionals',day)[k]}</small>`;return `<td class="${k==='follows'&&v>=g?'hit':''}">${v}${sub}</td>`};
 const rows=days.map(d=>`<tr class="d" data-d="${d}"><td>${d}${F==='combined'?'<small>Reg+Pro</small>':''}</td>${K.map(k=>cell(k,d)).join('')}</tr>`+(OPEN===d?`<tr class="det"><td colspan="6">${detail(d)}</td></tr>`:'')).join('');
 return seg(FOPT,F,'f')+(days.length?`<table><tr><th>Date</th><th>Follows</th><th>Accept</th><th>Texts</th><th>Chats</th><th>Prosp</th></tr>${rows}</table><div class="sub" style="margin-top:10px">Green = daily goal hit (${g} follows). Tap a day for handles.</div>`:'<div class="empty">No days recorded yet</div>');
}
function render(){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===V));
 const y=scrollY;document.getElementById('app').innerHTML=V==='today'?today():V==='trends'?trends():history();scrollTo(0,y);
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{T=b.dataset.t;render()});
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{F=b.dataset.f;render()});
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{PER=b.dataset.p;render()});
 document.querySelectorAll('tr.d').forEach(r=>r.onclick=()=>{OPEN=OPEN===r.dataset.d?null:r.dataset.d;render()});
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{V=b.dataset.v;render()});
async function load(){try{D=await (await fetch('data.json?t='+Date.now(),{cache:'no-store'})).json();
 document.getElementById('upd').textContent=D.updated?'Updated '+new Date(D.updated).toLocaleString('en-CA',{timeZone:'America/Toronto'})+' (Toronto)':'No activity yet';render()}catch(e){document.getElementById('upd').textContent='Failed to load data'}}
load();setInterval(load,60000);
</script></body></html>
